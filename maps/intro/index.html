<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santo Domingo — Intro</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <div id="loading-overlay">
        <p>Loading map…</p>
      </div>

      <!-- Same standard control row as every other map (template's
           reorient/resume-showcase/3D-toggle/settings), just re-themed light
           to match this map's non-dark basemap. -->
      <button id="reorient-toggle" type="button" class="icon-button" aria-label="Reset map orientation" title="Reset map orientation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <polygon points="12,5 14,12 12,19 10,12" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button id="resume-showcase-toggle" type="button" class="icon-button" aria-label="Resume auto tour" title="Resume auto tour">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="6,4 20,12 6,20" />
        </svg>
      </button>
      <button id="view-3d-toggle" type="button" class="icon-button" aria-label="Toggle 3D buildings" title="Toggle 3D buildings">3D</button>
      <button id="charts-toggle" type="button" class="icon-button active" aria-label="Toggle plots" title="Toggle plots">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="19" x2="5" y2="11" />
          <line x1="12" y1="19" x2="12" y2="5" />
          <line x1="19" y1="19" x2="19" y2="14" />
        </svg>
      </button>
      <button id="settings-toggle" type="button" class="icon-button" aria-label="Settings" title="Settings (placeholder)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6" />
          <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
          <line x1="4" y1="18" x2="20" y2="18" />
          <circle cx="7" cy="18" r="2" fill="currentColor" stroke="none" />
        </svg>
      </button>

      <aside id="settings-panel" class="glass-panel hidden">
        <div class="panel-actions">
          <button id="settings-panel-close" aria-label="Close">&times;</button>
        </div>
        <div id="settings-panel-content">
          <h2>Settings</h2>
          <p class="hint">More controls coming later.</p>
        </div>
      </aside>

      <aside id="controls" class="glass-panel">
        <button id="controls-toggle" type="button" aria-label="Hide legend" title="Toggle legend">⟨</button>
        <div id="controls-body">
          <h1>Santo Domingo</h1>
          <p class="subtitle" id="title-subtitle">Building surveys</p>

          <div id="controls-fields">
            <div id="legend"></div>
          </div>

        </div>
      </aside>

      <aside id="charts-panel" class="glass-panel">
        <div class="chart-card">
          <h3>Surveyed coverage</h3>
          <div id="chart-survey-body"></div>
        </div>
        <div class="chart-card">
          <h3 id="chart-attribute-title">Structural system</h3>
          <div id="chart-attribute-body"></div>
        </div>
      </aside>

      <aside id="building-panel" class="glass-panel hidden">
        <div class="panel-actions">
          <button id="building-panel-close" aria-label="Close">&times;</button>
        </div>
        <div id="building-panel-content"></div>
      </aside>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/deck.gl@9/dist.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
