<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santo Domingo Building Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <!-- Top-right icon buttons, same row layout as the visor (mapLayers/style.css
           #view-3d-toggle / #reorient-toggle / #settings-toggle). Kept even though
           the showcase mode already flips these on its own, so a user can also
           drive them manually once they've taken control of the map. -->
      <button id="reorient-toggle" type="button" class="icon-button" aria-label="Reset map orientation" title="Reset map orientation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <polygon points="12,5 14,12 12,19 10,12" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button id="resume-showcase-toggle" type="button" class="icon-button" aria-label="Resume auto tour" title="Resume auto tour">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="6,4 20,12 6,20" />
        </svg>
      </button>
      <button id="view-3d-toggle" type="button" class="icon-button active" aria-label="Toggle 3D buildings" title="Toggle 3D buildings">3D</button>
      <button id="settings-toggle" type="button" class="icon-button" aria-label="Settings" title="Settings (placeholder)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6" />
          <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
          <line x1="4" y1="18" x2="20" y2="18" />
          <circle cx="7" cy="18" r="2" fill="currentColor" stroke="none" />
        </svg>
      </button>

      <!-- Placeholder flyout, styled like the visor's #settings-panel /
           #typology-metrics-panel. Empty on purpose: a future map built from
           this template can drop a real settings/legend-options UI in here
           without having to invent the panel chrome again. -->
      <aside id="settings-panel" class="glass-panel hidden">
        <div class="panel-actions">
          <button id="settings-panel-close" aria-label="Close">&times;</button>
        </div>
        <div id="settings-panel-content">
          <h2>Settings</h2>
          <p class="hint">Placeholder panel — wire up real controls here (e.g. basemap choice, showcase timing) following the visor's settingsPanel.ts pattern.</p>
        </div>
      </aside>

      <!-- Left control panel, mirrors the visor's #controls: a title and
           legend that always stay visible (video mode included), plus a
           "color by" attribute picker tucked behind #controls-toggle. -->
      <aside id="controls" class="glass-panel">
        <button id="controls-toggle" type="button" class="collapsed" aria-label="Show controls" title="Show controls">⟨</button>
        <div id="controls-body">
          <div class="panel-title-row">
            <button id="legend-toggle" class="icon-toggle-small active" type="button" aria-label="Hide legend" title="Toggle legend">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="5" height="5" rx="1" fill="currentColor" stroke="none" /><rect x="3" y="14" width="5" height="5" rx="1" fill="currentColor" stroke="none" />
                <line x1="11" y1="7.5" x2="21" y2="7.5" /><line x1="11" y1="16.5" x2="21" y2="16.5" />
              </svg>
            </button>
            <div>
              <h1>Santo Domingo</h1>
              <p class="subtitle">Building database — frontend template</p>
            </div>
          </div>

          <div id="controls-fields" class="hidden">
            <label>Color by</label>
            <div id="attribute-select"></div>
          </div>

          <div id="legend"></div>

        </div>
      </aside>

      <!-- Building popup, styled like the visor's bottom-drawer #building-panel,
           but a right-docked card here since this template has no other bottom
           UI competing for that space. Content is generated generically from
           whatever properties the clicked feature has (see main.js::renderBuildingPanel) -
           add dedicated sub-sections/tabs here later the same way the visor
           splits its own drawer into Overview/Vulnerability/Curves tabs. -->
      <aside id="building-panel" class="glass-panel hidden">
        <div class="panel-actions">
          <button id="building-panel-close" aria-label="Close">&times;</button>
        </div>
        <div id="building-panel-content"></div>
      </aside>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/deck.gl@9/dist.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
